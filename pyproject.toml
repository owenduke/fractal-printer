[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractal_printer"
version = "0.1.0"
description = "My fractal printer"
requires-python = ">=3.11"
dependencies = [
    "fast-simplification",
    "ipykernel>=7.3.0",
    "matplotlib",
    "meshio",
    "moderngl",
    "numba",
    "numpy",
    "numpy-quaternion",
    "pyperclip",
    "PyQt6",
    "scikit-image>=0.17",
    "sdf",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.uv.sources]
sdf = { git = "https://github.com/fogleman/sdf.git", rev = "d58a6fc63b75fc1cf1ebb71e0b42bf552319c8f1" }
